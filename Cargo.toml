[workspace]
resolver = "2"
members = [
    "crates/linop-core",
    "crates/linop-ssh",
    "crates/linop-sftp",
    "crates/linop-term",
    "crates/linop-monitor",
    "crates/linop-cast",
    "crates/linop-telnet",
    "crates/linop-i18n",
    "crates/linop-theme",
    "crates/linop-sync",
    "crates/linop-navop-importer",
    "crates/linop-testsupport",
    "apps/linop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/xiuran/Linop"

[workspace.dependencies]
linop-core = { path = "crates/linop-core" }
linop-ssh = { path = "crates/linop-ssh" }
linop-sftp = { path = "crates/linop-sftp" }
linop-term = { path = "crates/linop-term" }
linop-monitor = { path = "crates/linop-monitor" }
linop-cast = { path = "crates/linop-cast" }
linop-telnet = { path = "crates/linop-telnet" }
linop-i18n = { path = "crates/linop-i18n" }
linop-theme = { path = "crates/linop-theme" }
linop-sync = { path = "crates/linop-sync" }

tokio = { version = "1", features = ["full"] }
russh = "0.65"
russh-sftp = "3"
ratatui = "0.30"
crossterm = "0.29"
vt100 = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
getrandom = "0.2"
toml = "1"
anyhow = "1"
thiserror = "2"
dirs = "7"

[profile.release]
lto = "thin"
