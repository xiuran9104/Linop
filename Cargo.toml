[workspace]
resolver = "2"
members = [
    "crates/linop-core",
    "crates/linop-ssh",
    "crates/linop-sftp",
    "crates/linop-term",
    "crates/linop-monitor",
    "crates/linop-cast",
    "crates/linop-db",
    "crates/linop-redis",
    "crates/linop-testsupport",
    "apps/linop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/xiuran/Linop"

[workspace.dependencies]
linop-core = { path = "crates/linop-core" }
linop-ssh = { path = "crates/linop-ssh" }
linop-sftp = { path = "crates/linop-sftp" }
linop-term = { path = "crates/linop-term" }
linop-monitor = { path = "crates/linop-monitor" }
linop-cast = { path = "crates/linop-cast" }
linop-db = { path = "crates/linop-db" }
linop-redis = { path = "crates/linop-redis" }

tokio = { version = "1", features = ["full"] }
russh = "0.65"
russh-sftp = "3"
ratatui = "0.30"
crossterm = "0.29"
vt100 = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
toml = "1"
anyhow = "1"
thiserror = "2"
dirs = "7"

[profile.release]
lto = "thin"
