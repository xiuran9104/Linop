services:
  dbx:
    image: t8y2/dbx:latest
    # For faster pulls in China, use the CNB image instead:
    # image: docker.cnb.cool/dbxio.com/dbx:latest
    pull_policy: always
    ports:
      - "4224:4224"
    volumes:
      - linop-db-data:/app/data
      - linop-db-backups:/app/backups
    environment:
      DBX_BACKUP_ROOT: /app/backups
      # DBX_SECRET_KEY_FILE: /run/secrets/linop_db_secret_key
    # secrets:
    #   - linop_db_secret_key
    stop_grace_period: 90s
    restart: unless-stopped

volumes:
  linop-db-data:
  linop-db-backups:

# secrets:
#   linop_db_secret_key:
#     file: ./linop_db_secret_key
