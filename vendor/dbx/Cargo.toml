[workspace]
resolver = "2"
members = ["src-tauri", "crates/linop-db-core", "crates/linop-db-driver-agent", "crates/linop-db-driver-support", "crates/linop-db-driver-elasticsearch", "crates/linop-db-driver-mongodb", "crates/linop-db-driver-mysql", "crates/linop-db-driver-postgres", "crates/linop-db-driver-redis", "crates/linop-db-driver-sqlserver", "crates/linop-db-drivers", "crates/linop-db-sql", "crates/linop-db-sql-core", "crates/linop-db-sql-data", "crates/linop-db-sql-dialect", "crates/linop-db-sql-schema", "crates/linop-db-plugin-runtime", "crates/linop-db-formats", "crates/linop-db-types", "crates/linop-db-platform", "crates/linop-db-ai-provider", "crates/linop-db-web", "crates/linop-db-mcp", "crates/linop-db-cli", "crates/linop-db-sqlite-worker", "crates/linop-db-tauri-consul", "crates/linop-db-tauri-schema"]
exclude = ["vendor/tauri-plugin-updater", "vendor/ctor", "vendor/dirs-sys", "vendor/pageant", "vendor/rumqttc", "vendor/tiberius", "vendor/webview2-com-sys", "vendor/wry"]

[patch.crates-io]
# The offline Win7 / Server 2012 R2 bundle links the WebView2 SDK 1.0.902.49
# loader. Loaders >= 1.0.1054.31 import EventSetInformation, which Win7 and
# Server 2012 R2 do not provide. Keep that loader in the source tree instead of
# swapping a file inside the cargo registry, because a registry swap bypasses
# compile caches and once shipped a binary linked against the wrong loader.
webview2-com-sys = { path = "vendor/webview2-com-sys" }
# Offline signed update restoration and checked Windows installer launch.
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }
# Tauri 2.11 uses ctor 0.8, which excludes Rust's win7 vendor. This vendors
# upstream rust-ctor#443 until tauri-utils moves to ctor 1.x.
ctor = { path = "vendor/ctor" }
# rumqttc 0.24 hardcodes MQTT 3.1.1; this patch adds MQTT 3.1 CONNECT encoding.
rumqttc = { path = "vendor/rumqttc" }
# Keep two small upstream crates on Win7-compatible API calls. Their current
# Windows bindings otherwise import COMBASE or WinRT APIs unavailable on Win7.
dirs-sys = { path = "vendor/dirs-sys" }
pageant = { path = "vendor/pageant" }
# Wry 0.55 probes and creates WebView2 with a null browser folder. Pass the
# bundled Fixed Runtime path explicitly so Windows 7 does not fall back to an
# unavailable system Runtime. The vendored copy also intercepts the WebView2
# F6 "Focus Next Pane" accelerator to prevent a black screen on frameless
# Overlay-titlebar windows, and registers a ProcessFailed handler that
# auto-recovers the webview when the renderer process fails while the host
# process stays alive (black screen after an overnight idle session, see
# vendor/wry/src/webview2/mod.rs). Recovery is layered by process kind
# (browser exit is fatal, GPU exits are self-healed by WebView2) and bounded
# by a cooldown plus a maximum reload budget. It also re-owns clipboard
# writes performed by the WebView2 browser process on the host window so
# copies show up in Windows Clipboard History / Win+V
# (MicrosoftEdge/WebView2Feedback#5650, see
# vendor/wry/src/webview2/clipboard_history.rs).
wry = { path = "vendor/wry" }
tokio-postgres = { git = "file:///home/xiuran/Linop/vendor/dbx/git-forks/tokio-postgres-gaussdb.git", rev = "ff64ab59190e427e09fcd187974bdaf088e4f129" }
postgres-types = { git = "file:///home/xiuran/Linop/vendor/dbx/git-forks/tokio-postgres-gaussdb.git", rev = "ff64ab59190e427e09fcd187974bdaf088e4f129" }
postgres-protocol = { git = "file:///home/xiuran/Linop/vendor/dbx/git-forks/tokio-postgres-gaussdb.git", rev = "ff64ab59190e427e09fcd187974bdaf088e4f129" }
# Temporary compatibility patches for deprecated sha256_password accounts and
# rustls dangerous-mode connections to legacy certificates. Remove after upstream support lands.
mysql_async = { git = "file:///home/xiuran/Linop/vendor/dbx/git-forks/mysql_async.git", rev = "0c621e0248f2c75563b90b3d04628afae539ba40" }
# Preserve readable SQL Server result sets when a row contains an unpaired
# UTF-16 surrogate, or varchar/text bytes that are invalid in the column's
# collation (replaced with U+FFFD, no BOM sniffing). Remove after the behavior
# is available in upstream tiberius.
tiberius = { path = "vendor/tiberius" }

[profile.dev.package."*"]
# Dependencies are never breakpoint-inspected in dev; line tables keep
# backtraces resolvable while shrinking dev/test build time and artifacts.
debug = "line-tables-only"

[profile.release]
panic = "abort"
strip = true
lto = true
codegen-units = 1
opt-level = "s"
