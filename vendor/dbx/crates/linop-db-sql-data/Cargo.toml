[package]
name = "linop-db-sql-data"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
default = []
openapi = ["dep:utoipa", "linop-db-types/openapi"]

[dependencies]
linop-db-sql-core = { path = "../linop-db-sql-core" }
linop-db-sql-dialect = { path = "../linop-db-sql-dialect" }
linop-db-types = { path = "../linop-db-types", default-features = false }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order"] }
sqlparser = { version = "0.62.0", features = ["visitor"] }
unicode-width = "0.2"
utoipa = { version = "5.5", optional = true }
