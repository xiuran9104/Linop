[package]
name = "linop-navop-importer"
description = "Linop connections.toml importer as a navop WASM extension (wasm32-wasip2 component)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# cdylib: wasm 组件产物;rlib:宿主侧单测直接跑纯逻辑。
crate-type = ["cdylib", "rlib"]

[dependencies]
wit-bindgen = "0.63"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
# 宿主测试用 linop-core 生成样例 connections.toml
linop-core = { path = "../linop-core" }

# 注:协议模型已原样拷贝至 src/protocol.rs(vendored navop,Apache-2.0),
# 避免 path 依赖跨 workspace 继承失败。
